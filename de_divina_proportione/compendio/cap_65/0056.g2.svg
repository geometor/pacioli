<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 320" width="160" height="320" class="euclid-graphic" data-graphic-id="0056.g2" data-folio="0056" data-graphic="g2">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-assert-active.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-assert-active.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
  </g>
  <g id="graphics">
    <path id="el-b0" data-ref="/ B0 /" data-type="segment" class="geom-line" d="M 22 295 L 80 295 L 138 295" />
    <path id="el-c0" data-ref="/ C0 /" data-type="segment" class="geom-line" d="M 80 35 L 51 165 L 22 295" />
    <path id="el-b1" data-ref="/ B1 /" data-type="segment" class="geom-line" d="M 138 295 L 134 245 L 130 195" />
    <path id="el-c1" data-ref="/ C1 /" data-type="segment" class="geom-line" d="M 80 35 L 109 165 L 138 295" />
    <path id="el-b2" data-ref="/ B2 /" data-type="segment" class="geom-line" d="M 130 195 L 86 195 L 42 195" />
    <path id="el-c2" data-ref="/ C2 /" data-type="segment" class="geom-line" d="M 80 35 L 105 115 L 130 195" />
    <path id="el-b3" data-ref="/ B3 /" data-type="segment" class="geom-line" d="M 42 195 L 32 245 L 22 295" />
    <path id="el-c3" data-ref="/ C3 /" data-type="segment" class="geom-line" d="M 80 35 L 61 115 L 42 195" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-b0" data-ref="/ B0 /" class="geom-line geom-overlay" d="M 22 295 L 80 295 L 138 295" />
    <path id="hl-c0" data-ref="/ C0 /" class="geom-line geom-overlay" d="M 80 35 L 51 165 L 22 295" />
    <path id="hl-b1" data-ref="/ B1 /" class="geom-line geom-overlay" d="M 138 295 L 134 245 L 130 195" />
    <path id="hl-c1" data-ref="/ C1 /" class="geom-line geom-overlay" d="M 80 35 L 109 165 L 138 295" />
    <path id="hl-b2" data-ref="/ B2 /" class="geom-line geom-overlay" d="M 130 195 L 86 195 L 42 195" />
    <path id="hl-c2" data-ref="/ C2 /" class="geom-line geom-overlay" d="M 80 35 L 105 115 L 130 195" />
    <path id="hl-b3" data-ref="/ B3 /" class="geom-line geom-overlay" d="M 42 195 L 32 245 L 22 295" />
    <path id="hl-c3" data-ref="/ C3 /" class="geom-line geom-overlay" d="M 80 35 L 61 115 L 42 195" />
  </g>
  <g id="points">
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="80" cy="35" r="3.2" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-c" data-ref="C" x="80" y="20" text-anchor="middle" class="geom-label">c</text>
    <text id="lbl-d" data-ref="D" x="80" y="265" text-anchor="middle" class="geom-label">d</text>
  </g>
</svg>

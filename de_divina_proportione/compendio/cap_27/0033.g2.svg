    <path id="el-DF" data-ref="/ D F /" data-type="segment" class="geom-line" d="M 112.75 175 L 112.75 111.77 L 112.75 48.54" />
    <path id="el-CF" data-ref="/ C F /" data-type="segment" class="geom-line" d="M 25 175 L 68.88 111.77 L 112.75 48.54" />
    <path id="el-FA" data-ref="/ F A /" data-type="segment" class="geom-line" d="M 112.75 48.54 L 203.88 111.77 L 295 175" />
    <path id="el-CB" data-ref="/ C B /" data-type="segment" class="geom-line" d="M 25 175 L 68.88 137.5 L 112.75 100" />
    <path id="el-BA" data-ref="/ B A /" data-type="segment" class="geom-line" d="M 112.75 100 L 203.88 137.5 L 295 175" />
    <path id="el-CE" data-ref="/ C E /" data-type="segment" class="geom-line" d="M 25 175 L 68.88 152.5 L 112.75 130" />
    <path id="el-EA" data-ref="/ E A /" data-type="segment" class="geom-line" d="M 112.75 130 L 203.88 152.5 L 295 175" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-semi" data-ref="( O A )" class="geom-circle geom-overlay" d="M 295 175 A 135 135 0 0 0 25 175" />
    <path id="hl-inner" data-ref="( O2 A )" class="geom-arc geom-overlay" d="M 295 175 A 216 216 0 0 0 25 175" />
    <path id="hl-CA" data-ref="/ C A /" class="geom-bold geom-overlay" d="M 25 175 L 160 175 L 295 175" />
    <path id="hl-DF" data-ref="/ D F /" class="geom-line geom-overlay" d="M 112.75 175 L 112.75 111.77 L 112.75 48.54" />
    <path id="hl-CF" data-ref="/ C F /" class="geom-line geom-overlay" d="M 25 175 L 68.88 111.77 L 112.75 48.54" />
    <path id="hl-FA" data-ref="/ F A /" class="geom-line geom-overlay" d="M 112.75 48.54 L 203.88 111.77 L 295 175" />
    <path id="hl-CB" data-ref="/ C B /" class="geom-line geom-overlay" d="M 25 175 L 68.88 137.5 L 112.75 100" />
    <path id="hl-BA" data-ref="/ B A /" class="geom-line geom-overlay" d="M 112.75 100 L 203.88 137.5 L 295 175" />
    <path id="hl-CE" data-ref="/ C E /" class="geom-line geom-overlay" d="M 25 175 L 68.88 152.5 L 112.75 130" />
    <path id="hl-EA" data-ref="/ E A /" class="geom-line geom-overlay" d="M 112.75 130 L 203.88 152.5 L 295 175" />
  </g>
  <g id="points">
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="25" cy="175" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="112.75" cy="175" r="3.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="295" cy="175" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="112.75" cy="48.54" r="3.2" class="geom-point" />
  </g>

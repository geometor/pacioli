    <path id="hl-GH" data-ref="/ G H /" class="geom-line geom-overlay" d="M 45.81 231 L 148 231 L 250.19 231" />
    <path id="hl-FE" data-ref="/ F E /" class="geom-line geom-overlay" d="M 148 54 L 148 113 L 148 172" />
    <path id="hl-GE" data-ref="/ G E /" class="geom-line geom-overlay" d="M 45.81 231 L 96.9 201.5 L 148 172" />
    <path id="hl-EH" data-ref="/ E H /" class="geom-line geom-overlay" d="M 148 172 L 199.1 201.5 L 250.19 231" />
    <path id="hl-FK" data-ref="/ F K /" class="geom-line geom-overlay" d="M 148 54 L 224.5 54 L 301 54" />

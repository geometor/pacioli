<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="200" height="320" class="euclid-graphic" data-graphic-id="0053.g2" data-folio="0053" data-graphic="g2">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-assert-active.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-assert-active.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
  </g>
  <g id="graphics">
    <polygon id="el-rect" data-ref="&lt; D TR E C &gt;" data-type="polygon" points="30,40 170,40 170,275 30,275" class="geom-polygon" />
    <path id="el-DTR" data-ref="/ DTR /" data-type="segment" class="geom-line" d="M 30 40 L 100 40 L 170 40" />
    <path id="el-TRE" data-ref="/ TRE /" data-type="segment" class="geom-line" d="M 170 40 L 170 157.5 L 170 275" />
    <path id="el-EC" data-ref="/ EC /" data-type="segment" class="geom-line" d="M 170 275 L 100 275 L 30 275" />
    <path id="el-CD" data-ref="/ CD /" data-type="segment" class="geom-line" d="M 30 275 L 30 157.5 L 30 40" />
    <path id="el-AB" data-ref="/ AB /" data-type="segment" class="geom-line" d="M 100 40 L 100 157.5 L 100 275" />
    <path id="el-DE" data-ref="/ DE /" data-type="segment" class="geom-line" d="M 30 40 L 100 157.5 L 170 275" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-rect" data-ref="&lt; D TR E C &gt;" points="30,40 170,40 170,275 30,275" class="geom-polygon geom-overlay" />
    <path id="hl-DTR" data-ref="/ DTR /" class="geom-line geom-overlay" d="M 30 40 L 100 40 L 170 40" />
    <path id="hl-TRE" data-ref="/ TRE /" class="geom-line geom-overlay" d="M 170 40 L 170 157.5 L 170 275" />
    <path id="hl-EC" data-ref="/ EC /" class="geom-line geom-overlay" d="M 170 275 L 100 275 L 30 275" />
    <path id="hl-CD" data-ref="/ CD /" class="geom-line geom-overlay" d="M 30 275 L 30 157.5 L 30 40" />
    <path id="hl-AB" data-ref="/ AB /" class="geom-line geom-overlay" d="M 100 40 L 100 157.5 L 100 275" />
    <path id="hl-DE" data-ref="/ DE /" class="geom-line geom-overlay" d="M 30 40 L 100 157.5 L 170 275" />
  </g>
  <g id="points">
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="30" cy="40" r="3.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="100" cy="40" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="30" cy="275" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="100" cy="275" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="170" cy="275" r="3.2" class="geom-point" />
    <circle id="el-pt-G" data-ref="G" data-type="point" cx="100" cy="157.5" r="3.2" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-d" data-ref="D" x="30" y="28" text-anchor="middle" class="geom-label">d</text>
    <text id="lbl-a" data-ref="A" x="100" y="28" text-anchor="middle" class="geom-label">a</text>
    <text id="lbl-c" data-ref="C" x="30" y="293" text-anchor="middle" class="geom-label">c</text>
    <text id="lbl-b" data-ref="B" x="100" y="293" text-anchor="middle" class="geom-label">b</text>
    <text id="lbl-e" data-ref="E" x="170" y="293" text-anchor="middle" class="geom-label">e</text>
    <text id="lbl-g" data-ref="G" x="114" y="161.5" text-anchor="middle" class="geom-label">g</text>
    <text id="lbl-num10" x="65" y="200" text-anchor="middle" class="geom-label-sm">10</text>
  </g>
</svg>

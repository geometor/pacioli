<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" class="euclid-graphic" data-graphic-id="0035.g1" data-folio="0035" data-graphic="g1">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-assert-active.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-assert-active.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
    <path id="el-semi" data-ref="( O A )" data-type="arc" class="geom-circle" d="M 292 165 A 132 132 0 0 0 28 165" />
  </g>
  <g id="graphics">
    <polygon id="el-tri-bha" data-ref="&lt; B H A &gt;" data-type="polygon" points="28,165 87.4,54.76 292,165" class="geom-polygon" />
    <path id="el-BA" data-ref="/ B A /" data-type="segment" class="geom-bold" d="M 28 165 L 160 165 L 292 165" />
    <path id="el-BH" data-ref="/ B H /" data-type="segment" class="geom-line" d="M 28 165 L 57.7 109.88 L 87.4 54.76" />
    <path id="el-CH" data-ref="/ C H /" data-type="segment" class="geom-line" d="M 87.4 165 L 87.4 109.88 L 87.4 54.76" />
    <path id="el-HA" data-ref="/ H A /" data-type="segment" class="geom-line" d="M 87.4 54.76 L 189.7 109.88 L 292 165" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-semi" data-ref="( O A )" class="geom-circle geom-overlay" d="M 292 165 A 132 132 0 0 0 28 165" />
    <polygon id="hl-tri-bha" data-ref="&lt; B H A &gt;" points="28,165 87.4,54.76 292,165" class="geom-polygon geom-overlay" />
    <path id="hl-BA" data-ref="/ B A /" class="geom-bold geom-overlay" d="M 28 165 L 160 165 L 292 165" />
    <path id="hl-BH" data-ref="/ B H /" class="geom-line geom-overlay" d="M 28 165 L 57.7 109.88 L 87.4 54.76" />
    <path id="hl-CH" data-ref="/ C H /" class="geom-line geom-overlay" d="M 87.4 165 L 87.4 109.88 L 87.4 54.76" />
    <path id="hl-HA" data-ref="/ H A /" class="geom-line geom-overlay" d="M 87.4 54.76 L 189.7 109.88 L 292 165" />
  </g>
  <g id="points">
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="28" cy="165" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="87.4" cy="165" r="3.2" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="292" cy="165" r="3.2" class="geom-point" />
    <circle id="el-pt-H" data-ref="H" data-type="point" cx="87.4" cy="54.76" r="3.2" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-b" data-ref="B" x="22" y="183" text-anchor="middle" class="geom-label">b</text>
    <text id="lbl-c" data-ref="C" x="87.4" y="183" text-anchor="middle" class="geom-label">c</text>
    <text id="lbl-a" data-ref="A" x="298" y="183" text-anchor="middle" class="geom-label">a</text>
    <text id="lbl-h" data-ref="H" x="87.4" y="42.76" text-anchor="middle" class="geom-label">h</text>
    <text id="lbl-num16" x="205" y="105" text-anchor="middle" class="geom-label-sm">16</text>
  </g>
</svg>

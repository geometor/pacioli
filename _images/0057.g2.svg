<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" class="euclid-graphic" data-graphic-id="0057.g2" data-folio="0057" data-graphic="g2">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-assert-active.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-assert-active.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
  </g>
  <g id="graphics">
    <polygon id="el-pent" data-ref="&lt; A B C D E &gt;" data-type="polygon" points="150,42 37.78,123.54 80.64,255.46 219.36,255.46 262.22,123.54" class="geom-polygon" />
    <path id="el-AB" data-ref="/ A B /" data-type="segment" class="geom-bold" d="M 150 42 L 93.89 82.77 L 37.78 123.54" />
    <path id="el-BC" data-ref="/ B C /" data-type="segment" class="geom-bold" d="M 37.78 123.54 L 59.21 189.5 L 80.64 255.46" />
    <path id="el-CD" data-ref="/ C D /" data-type="segment" class="geom-bold" d="M 80.64 255.46 L 150 255.46 L 219.36 255.46" />
    <path id="el-DE" data-ref="/ D E /" data-type="segment" class="geom-bold" d="M 219.36 255.46 L 240.79 189.5 L 262.22 123.54" />
    <path id="el-EA" data-ref="/ E A /" data-type="segment" class="geom-bold" d="M 262.22 123.54 L 206.11 82.77 L 150 42" />
    <path id="el-AC" data-ref="/ A C /" data-type="segment" class="geom-line" d="M 150 42 L 115.32 148.73 L 80.64 255.46" />
    <path id="el-AD" data-ref="/ A D /" data-type="segment" class="geom-line" d="M 150 42 L 184.68 148.73 L 219.36 255.46" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-pent" data-ref="&lt; A B C D E &gt;" points="150,42 37.78,123.54 80.64,255.46 219.36,255.46 262.22,123.54" class="geom-polygon geom-overlay" />
    <path id="hl-AB" data-ref="/ A B /" class="geom-bold geom-overlay" d="M 150 42 L 93.89 82.77 L 37.78 123.54" />
    <path id="hl-BC" data-ref="/ B C /" class="geom-bold geom-overlay" d="M 37.78 123.54 L 59.21 189.5 L 80.64 255.46" />
    <path id="hl-CD" data-ref="/ C D /" class="geom-bold geom-overlay" d="M 80.64 255.46 L 150 255.46 L 219.36 255.46" />
    <path id="hl-DE" data-ref="/ D E /" class="geom-bold geom-overlay" d="M 219.36 255.46 L 240.79 189.5 L 262.22 123.54" />
    <path id="hl-EA" data-ref="/ E A /" class="geom-bold geom-overlay" d="M 262.22 123.54 L 206.11 82.77 L 150 42" />
    <path id="hl-AC" data-ref="/ A C /" class="geom-line geom-overlay" d="M 150 42 L 115.32 148.73 L 80.64 255.46" />
    <path id="hl-AD" data-ref="/ A D /" class="geom-line geom-overlay" d="M 150 42 L 184.68 148.73 L 219.36 255.46" />
  </g>
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="150" cy="42" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="37.78" cy="123.54" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="80.64" cy="255.46" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="219.36" cy="255.46" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="262.22" cy="123.54" r="3.2" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-a" data-ref="A" x="150" y="30" text-anchor="middle" class="geom-label">a</text>
    <text id="lbl-b" data-ref="B" x="23.78" y="119.54" text-anchor="middle" class="geom-label">b</text>

    <path id="hl-t0" data-ref="/ T0 /" class="geom-line geom-overlay" d="M 70 22 L 94 34 L 118 46" />
    <path id="hl-b0" data-ref="/ B0 /" class="geom-line geom-overlay" d="M 70 227 L 94 239 L 118 251" />

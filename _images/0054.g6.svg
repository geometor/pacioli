    <polygon id="el-kite" data-ref="&lt; kite &gt;" data-type="polygon" points="285,18 312,58 285,132 252,58" class="geom-polygon" />
    <path id="el-kite0" data-ref="/ kite0 /" data-type="segment" class="geom-bold" d="M 285 18 L 298.5 38 L 312 58" />
    <path id="el-kite1" data-ref="/ kite1 /" data-type="segment" class="geom-bold" d="M 312 58 L 298.5 95 L 285 132" />
    <path id="el-kite2" data-ref="/ kite2 /" data-type="segment" class="geom-bold" d="M 285 132 L 268.5 95 L 252 58" />
    <path id="el-kite3" data-ref="/ kite3 /" data-type="segment" class="geom-bold" d="M 252 58 L 268.5 38 L 285 18" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-rhomb" data-ref="&lt; rhomb &gt;" points="55,25 92,80 55,135 18,80" class="geom-polygon geom-overlay" />
    <path id="hl-rhomb0" data-ref="/ rhomb0 /" class="geom-bold geom-overlay" d="M 55 25 L 73.5 52.5 L 92 80" />
    <path id="hl-rhomb1" data-ref="/ rhomb1 /" class="geom-bold geom-overlay" d="M 92 80 L 73.5 107.5 L 55 135" />
    <path id="hl-rhomb2" data-ref="/ rhomb2 /" class="geom-bold geom-overlay" d="M 55 135 L 36.5 107.5 L 18 80" />
    <path id="hl-rhomb3" data-ref="/ rhomb3 /" class="geom-bold geom-overlay" d="M 18 80 L 36.5 52.5 L 55 25" />
    <polygon id="hl-arrow" data-ref="&lt; arrow &gt;" points="185,28 242,118 185,92 112,118" class="geom-polygon geom-overlay" />
    <path id="hl-arrow0" data-ref="/ arrow0 /" class="geom-bold geom-overlay" d="M 185 28 L 213.5 73 L 242 118" />
    <path id="hl-arrow1" data-ref="/ arrow1 /" class="geom-bold geom-overlay" d="M 242 118 L 213.5 105 L 185 92" />
    <path id="hl-arrow2" data-ref="/ arrow2 /" class="geom-bold geom-overlay" d="M 185 92 L 148.5 105 L 112 118" />
    <path id="hl-arrow3" data-ref="/ arrow3 /" class="geom-bold geom-overlay" d="M 112 118 L 148.5 73 L 185 28" />
    <polygon id="hl-kite" data-ref="&lt; kite &gt;" points="285,18 312,58 285,132 252,58" class="geom-polygon geom-overlay" />

    <path id="el-rhomb2" data-ref="/ rhomb2 /" data-type="segment" class="geom-bold" d="M 55 135 L 36.5 107.5 L 18 80" />
    <path id="el-rhomb3" data-ref="/ rhomb3 /" data-type="segment" class="geom-bold" d="M 18 80 L 36.5 52.5 L 55 25" />
    <polygon id="el-arrow" data-ref="&lt; arrow &gt;" data-type="polygon" points="185,28 242,118 185,92 112,118" class="geom-polygon" />
    <path id="el-arrow0" data-ref="/ arrow0 /" data-type="segment" class="geom-bold" d="M 185 28 L 213.5 73 L 242 118" />
    <path id="el-arrow1" data-ref="/ arrow1 /" data-type="segment" class="geom-bold" d="M 242 118 L 213.5 105 L 185 92" />

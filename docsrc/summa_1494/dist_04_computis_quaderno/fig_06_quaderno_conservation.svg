<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" width="440" height="290" class="euclid-graphic" data-graphic-id="summa.I.9.quaderno" data-folio="fol. 202r" data-graphic="g1" data-proposition="Summa.I.IX.14">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.4;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-polygon-gnomon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.13;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, .geom-polygon-gnomon:hover, .geom-polygon-gnomon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-assert-active.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-assert-active.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
    <circle id="el-circle-ring" data-ref="( O K )" data-type="circle" cx="220" cy="145" r="105" class="geom-dashed" />
  </g>
  <g id="graphics">
    <path id="el-seg-axis" data-type="segment" class="geom-dashed" d="M 220 270 L 220 145 L 220 20" />
    <polygon id="el-poly-cycle" data-ref="&lt; K S M D P &gt;" data-type="polygon" points="220,40 129.07,92.5 129.07,197.5 310.93,92.5 310.93,197.5" class="geom-polygon" />
    <path id="el-seg-KS" data-ref="/ K S /" data-type="segment" class="geom-bold" d="M 220 40 L 174.53 66.25 L 129.07 92.5" />
    <path id="el-seg-SM" data-ref="/ S M /" data-type="segment" class="geom-line" d="M 129.07 92.5 L 129.07 145 L 129.07 197.5" />
    <path id="el-seg-MD" data-ref="/ M D /" data-type="segment" class="geom-line" d="M 129.07 197.5 L 220 145 L 310.93 92.5" />
    <path id="el-seg-DP" data-ref="/ D P /" data-type="segment" class="geom-line" d="M 310.93 92.5 L 310.93 145 L 310.93 197.5" />
    <path id="el-seg-DS" data-ref="/ D S /" data-type="segment" class="geom-bold" d="M 310.93 92.5 L 220 92.5 L 129.07 92.5" />
    <path id="el-seg-PK" data-ref="/ P K /" data-type="segment" class="geom-bold" d="M 310.93 197.5 L 265.47 118.75 L 220 40" />
    <path id="el-seg-SB" data-ref="/ S B /" data-type="segment" class="geom-dashed" d="M 129.07 92.5 L 174.53 171.25 L 220 250" />
    <path id="el-seg-KB" data-ref="/ K B /" data-type="segment" class="geom-dashed" d="M 220 40 L 220 145 L 220 250" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <circle id="hl-circle-ring" data-ref="( O K )" cx="220" cy="145" r="105" class="geom-dashed geom-overlay" />
    <polygon id="hl-poly-cycle" data-ref="&lt; K S M D P &gt;" points="220,40 129.07,92.5 129.07,197.5 310.93,92.5 310.93,197.5" class="geom-polygon geom-overlay" />
    <path id="hl-seg-KS" data-ref="/ K S /" class="geom-bold geom-overlay" d="M 220 40 L 174.53 66.25 L 129.07 92.5" />
    <path id="hl-seg-SM" data-ref="/ S M /" class="geom-line geom-overlay" d="M 129.07 92.5 L 129.07 145 L 129.07 197.5" />
    <path id="hl-seg-MD" data-ref="/ M D /" class="geom-line geom-overlay" d="M 129.07 197.5 L 220 145 L 310.93 92.5" />
    <path id="hl-seg-DP" data-ref="/ D P /" class="geom-line geom-overlay" d="M 310.93 92.5 L 310.93 145 L 310.93 197.5" />
    <path id="hl-seg-DS" data-ref="/ D S /" class="geom-bold geom-overlay" d="M 310.93 92.5 L 220 92.5 L 129.07 92.5" />
    <path id="hl-seg-PK" data-ref="/ P K /" class="geom-bold geom-overlay" d="M 310.93 197.5 L 265.47 118.75 L 220 40" />
    <path id="hl-seg-SB" data-ref="/ S B /" class="geom-dashed geom-overlay" d="M 129.07 92.5 L 174.53 171.25 L 220 250" />
    <path id="hl-seg-KB" data-ref="/ K B /" class="geom-dashed geom-overlay" d="M 220 40 L 220 145 L 220 250" />
  </g>
  <g id="points">
    <circle id="el-pt-K" data-ref="K" data-type="point" cx="220" cy="40" r="3.4" class="geom-point" />
    <circle id="el-pt-S" data-ref="S" data-type="point" cx="129.07" cy="92.5" r="3.4" class="geom-point" />
    <circle id="el-pt-M" data-ref="M" data-type="point" cx="129.07" cy="197.5" r="3.4" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="220" cy="250" r="3.4" class="geom-point" />
    <circle id="el-pt-P" data-ref="P" data-type="point" cx="310.93" cy="197.5" r="3.4" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="310.93" cy="92.5" r="3.4" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-K" data-ref="K" x="220" y="30" text-anchor="middle" class="geom-label">K (Cavedal)</text>
    <text id="lbl-S" data-ref="S" x="119.07" y="96.5" text-anchor="end" class="geom-label">S (Cassa)</text>
    <text id="lbl-M" data-ref="M" x="119.07" y="203.5" text-anchor="end" class="geom-label">M (Zenzer)</text>
    <text id="lbl-B" data-ref="B" x="220" y="266" text-anchor="middle" class="geom-label">B (Bilancio)</text>
    <text id="lbl-P" data-ref="P" x="320.93" y="203.5" text-anchor="start" class="geom-label">P (Pro e Danno)</text>
    <text id="lbl-D" data-ref="D" x="320.93" y="96.5" text-anchor="start" class="geom-label">D (Martino)</text>
    <text id="ann-dare-hdr" x="100" y="25" text-anchor="start" class="geom-label-sm">DARE (Per · Sinistra)</text>
    <text id="ann-avere-hdr" x="340" y="25" text-anchor="end" class="geom-label-sm">AVERE (A · Dextra)</text>
    <text id="ann-law" x="220" y="277.5" text-anchor="middle" class="geom-label-sm">1ᵀ · B = 0ᵀ  ⇔  Σ Dare = Σ Avere</text>
  </g>
</svg>

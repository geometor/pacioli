    <path id="el-seg-GS" data-ref="/ G S /" data-type="segment" class="geom-dashed" d="M 76 248 L 142.5 181.5 L 209 115" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-GBA" data-ref="&lt; G B A &gt;" points="76,248 342,248 171,20" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-GUV" data-ref="&lt; G U V &gt;" points="76,248 264.09,248 143.18,86.78" class="geom-polygon-gnomon geom-overlay" />
    <path id="hl-arc-semiGB" data-ref="( M B )" class="geom-dashed geom-overlay" d="M 342 248 A 133 133 0 0 0 76 248" />
    <path id="hl-arc-arcGS" data-ref="( G S )" class="geom-arc geom-overlay" d="M 264.09 248 A 188.09 188.09 0 0 0 209 115" />
    <path id="hl-seg-GB" data-ref="/ G B /" class="geom-bold geom-overlay" d="M 76 248 L 209 248 L 342 248" />
    <path id="hl-seg-GA" data-ref="/ G A /" class="geom-bold geom-overlay" d="M 76 248 L 123.5 134 L 171 20" />
    <path id="hl-seg-BA" data-ref="/ B A /" class="geom-bold geom-overlay" d="M 342 248 L 256.5 134 L 171 20" />
    <path id="hl-seg-UV" data-ref="/ U V /" class="geom-bold geom-overlay" d="M 264.09 248 L 203.63 167.39 L 143.18 86.78" />
    <path id="hl-seg-MS" data-ref="/ M S /" class="geom-dashed geom-overlay" d="M 209 248 L 209 181.5 L 209 115" />
    <path id="hl-seg-GS" data-ref="/ G S /" class="geom-dashed geom-overlay" d="M 76 248 L 142.5 181.5 L 209 115" />
  </g>

    <polygon id="el-poly-GUV" data-ref="&lt; G U V &gt;" data-type="polygon" points="76,248 264.09,248 143.18,86.78" class="geom-polygon-gnomon" />
    <path id="el-seg-GB" data-ref="/ G B /" data-type="segment" class="geom-bold" d="M 76 248 L 209 248 L 342 248" />
    <path id="el-seg-GA" data-ref="/ G A /" data-type="segment" class="geom-bold" d="M 76 248 L 123.5 134 L 171 20" />

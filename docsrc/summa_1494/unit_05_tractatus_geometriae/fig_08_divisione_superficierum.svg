    <circle id="el-pt-M" data-ref="M" data-type="point" cx="209" cy="248" r="3.4" class="geom-point" />
    <circle id="el-pt-U" data-ref="U" data-type="point" cx="264.09" cy="248" r="3.4" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="342" cy="248" r="3.4" class="geom-point" />
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="171" cy="20" r="3.4" class="geom-point" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280" width="300" height="280" class="euclid-graphic" data-graphic-id="0055.g2" data-folio="0055" data-graphic="g2">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-assert-active.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-assert-active.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
  </g>
  <g id="graphics">
    <path id="el-f0" data-ref="/ F0 /" data-type="segment" class="geom-bold" d="M 25 80 L 115 80 L 205 80" />
    <path id="el-in0" data-ref="/ I0 /" data-type="segment" class="geom-line" d="M 50 105 L 115 105 L 180 105" />
    <path id="el-f1" data-ref="/ F1 /" data-type="segment" class="geom-bold" d="M 205 80 L 205 167.5 L 205 255" />
    <path id="el-in1" data-ref="/ I1 /" data-type="segment" class="geom-line" d="M 180 105 L 180 167.5 L 180 230" />
    <path id="el-f2" data-ref="/ F2 /" data-type="segment" class="geom-bold" d="M 205 255 L 115 255 L 25 255" />
    <path id="el-in2" data-ref="/ I2 /" data-type="segment" class="geom-line" d="M 180 230 L 115 230 L 50 230" />
    <path id="el-f3" data-ref="/ F3 /" data-type="segment" class="geom-bold" d="M 25 255 L 25 167.5 L 25 80" />
    <path id="el-in3" data-ref="/ I3 /" data-type="segment" class="geom-line" d="M 50 230 L 50 167.5 L 50 105" />
    <path id="el-b0" data-ref="/ B0 /" data-type="segment" class="geom-bold" d="M 95 25 L 185 25 L 275 25" />
    <path id="el-b1" data-ref="/ B1 /" data-type="segment" class="geom-bold" d="M 275 25 L 275 112.5 L 275 200" />
    <path id="el-e0" data-ref="/ E0 /" data-type="segment" class="geom-bold" d="M 25 80 L 60 52.5 L 95 25" />
    <path id="el-e1" data-ref="/ E1 /" data-type="segment" class="geom-bold" d="M 205 80 L 240 52.5 L 275 25" />
    <path id="el-e2" data-ref="/ E2 /" data-type="segment" class="geom-bold" d="M 205 255 L 240 227.5 L 275 200" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-f0" data-ref="/ F0 /" class="geom-bold geom-overlay" d="M 25 80 L 115 80 L 205 80" />
    <path id="hl-in0" data-ref="/ I0 /" class="geom-line geom-overlay" d="M 50 105 L 115 105 L 180 105" />
    <path id="hl-f1" data-ref="/ F1 /" class="geom-bold geom-overlay" d="M 205 80 L 205 167.5 L 205 255" />
    <path id="hl-in1" data-ref="/ I1 /" class="geom-line geom-overlay" d="M 180 105 L 180 167.5 L 180 230" />
    <path id="hl-f2" data-ref="/ F2 /" class="geom-bold geom-overlay" d="M 205 255 L 115 255 L 25 255" />
    <path id="hl-in2" data-ref="/ I2 /" class="geom-line geom-overlay" d="M 180 230 L 115 230 L 50 230" />
    <path id="hl-f3" data-ref="/ F3 /" class="geom-bold geom-overlay" d="M 25 255 L 25 167.5 L 25 80" />
    <path id="hl-in3" data-ref="/ I3 /" class="geom-line geom-overlay" d="M 50 230 L 50 167.5 L 50 105" />
    <path id="hl-b0" data-ref="/ B0 /" class="geom-bold geom-overlay" d="M 95 25 L 185 25 L 275 25" />
    <path id="hl-b1" data-ref="/ B1 /" class="geom-bold geom-overlay" d="M 275 25 L 275 112.5 L 275 200" />
    <path id="hl-e0" data-ref="/ E0 /" class="geom-bold geom-overlay" d="M 25 80 L 60 52.5 L 95 25" />
    <path id="hl-e1" data-ref="/ E1 /" class="geom-bold geom-overlay" d="M 205 80 L 240 52.5 L 275 25" />
    <path id="hl-e2" data-ref="/ E2 /" class="geom-bold geom-overlay" d="M 205 255 L 240 227.5 L 275 200" />
  </g>
  <g id="points">

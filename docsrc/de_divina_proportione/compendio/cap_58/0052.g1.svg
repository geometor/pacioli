<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 440" width="210" height="440" class="euclid-graphic" data-graphic-id="0052.g1" data-folio="0052" data-graphic="g1">
  <style>
    :root {
      --geom-fg: #18181b;
      --geom-bg: #ffffff;
      --geom-point-stroke: #ffffff;
      --geom-poly-fill: #000000;
      --geom-accent: #c88a1e;
      --geom-assert: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --geom-fg: #d6cfc5;
        --geom-bg: #1e1e20;
        --geom-point-stroke: #1e1e20;
        --geom-poly-fill: #d6cfc5;
        --geom-accent: #e8b85a;
        --geom-assert: #5ec27e;
      }
    }
    .euclid-graphic {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-style: normal;
      font-weight: 700;
      background-color: var(--geom-bg);
    }
    .geom-line {
      stroke: var(--geom-fg);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-bold {
      stroke: var(--geom-fg);
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-circle, .geom-curve {
      stroke: var(--geom-fg);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-arc {
      stroke: var(--geom-fg);
      stroke-width: 1.6;
      stroke-linecap: round;
      fill: none;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-dashed, .geom-aux {
      stroke: var(--geom-fg);
      stroke-width: 1.3;
      stroke-dasharray: 4, 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .geom-tick-mark {
      stroke: var(--geom-assert);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .geom-polygon {
      fill: var(--geom-poly-fill);
      fill-opacity: 0.05;
      stroke: none;
      transition: fill-opacity 0.15s, stroke 0.15s;
    }
    .geom-point {
      fill: var(--geom-fg);
      stroke: var(--geom-point-stroke);
      stroke-width: 1.1;
      transition: fill 0.15s, r 0.15s;
    }
    .geom-label {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: var(--geom-fg);
      user-select: none;
    }
    .geom-label-sm {
      font-family: 'Fira Sans Condensed', 'Fira Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: var(--geom-fg);
      opacity: 0.88;
      user-select: none;
    }
    .geom-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    [data-ref]:hover, .highlight, .geom-highlight-active {
      opacity: 1 !important;
      stroke: var(--geom-accent) !important;
      cursor: pointer;
    }
    text[data-ref]:hover, text.highlight, text.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-polygon:hover, .geom-polygon.highlight, polygon.geom-highlight-active {
      opacity: 1 !important;
      fill-opacity: 0.24 !important;
      fill: var(--geom-accent) !important;
      stroke: var(--geom-accent) !important;
    }
    .geom-point:hover, .geom-point.highlight, circle.geom-point.geom-highlight-active {
      opacity: 1 !important;
      fill: var(--geom-accent) !important;
      stroke: none !important;
    }
    .geom-assert-active {
      opacity: 1 !important;
      stroke: var(--geom-assert) !important;
    }
    text.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    polygon.geom-assert-active {
      opacity: 1 !important;
      fill-opacity: 0.22 !important;
      fill: var(--geom-assert) !important;
      stroke: var(--geom-assert) !important;
    }
    circle.geom-point.geom-assert-active {
      opacity: 1 !important;
      fill: var(--geom-assert) !important;
      stroke: none !important;
    }
    path.geom-assert-active.geom-tick-1 {
      marker-mid: url(#geom-tick-1);
    }
    path.geom-assert-active.geom-tick-2 {
      marker-mid: url(#geom-tick-2);
    }
    path.geom-assert-active.geom-tick-3 {
      marker-mid: url(#geom-tick-3);
    }
  </style>
  <defs>
    <marker id="geom-tick-1" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-2" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-1.8" y1="-4.5" x2="-1.8" y2="4.5" class="geom-tick-mark" />
      <line x1="1.8" y1="-4.5" x2="1.8" y2="4.5" class="geom-tick-mark" />
    </marker>
    <marker id="geom-tick-3" viewBox="-6 -6 12 12" refX="0" refY="0" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <line x1="-3.2" y1="-4.5" x2="-3.2" y2="4.5" class="geom-tick-mark" />
      <line x1="0" y1="-4.5" x2="0" y2="4.5" class="geom-tick-mark" />
      <line x1="3.2" y1="-4.5" x2="3.2" y2="4.5" class="geom-tick-mark" />
    </marker>
  </defs>
  <g id="elements">
  </g>
  <g id="graphics">
    <path id="el-AB" data-ref="/ A B /" data-type="segment" class="geom-line" d="M 38 45 L 105 45 L 172 45" />
    <path id="el-AC" data-ref="/ A C /" data-type="segment" class="geom-line" d="M 38 45 L 71.5 70 L 105 95" />
    <path id="el-BC" data-ref="/ B C /" data-type="segment" class="geom-line" d="M 172 45 L 138.5 70 L 105 95" />
    <path id="el-DE" data-ref="/ D E /" data-type="segment" class="geom-line" d="M 38 395 L 105 395 L 172 395" />
    <path id="el-DF" data-ref="/ D F /" data-type="segment" class="geom-line" d="M 38 395 L 71.5 370 L 105 345" />
    <path id="el-EF" data-ref="/ E F /" data-type="segment" class="geom-line" d="M 172 395 L 138.5 370 L 105 345" />
    <path id="el-AD" data-ref="/ A D /" data-type="segment" class="geom-line" d="M 38 45 L 38 220 L 38 395" />
    <path id="el-BE" data-ref="/ B E /" data-type="segment" class="geom-line" d="M 172 45 L 172 220 L 172 395" />
    <path id="el-CF" data-ref="/ C F /" data-type="segment" class="geom-line" d="M 105 95 L 105 220 L 105 345" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-AB" data-ref="/ A B /" class="geom-line geom-overlay" d="M 38 45 L 105 45 L 172 45" />
    <path id="hl-AC" data-ref="/ A C /" class="geom-line geom-overlay" d="M 38 45 L 71.5 70 L 105 95" />
    <path id="hl-BC" data-ref="/ B C /" class="geom-line geom-overlay" d="M 172 45 L 138.5 70 L 105 95" />
    <path id="hl-DE" data-ref="/ D E /" class="geom-line geom-overlay" d="M 38 395 L 105 395 L 172 395" />
    <path id="hl-DF" data-ref="/ D F /" class="geom-line geom-overlay" d="M 38 395 L 71.5 370 L 105 345" />
    <path id="hl-EF" data-ref="/ E F /" class="geom-line geom-overlay" d="M 172 395 L 138.5 370 L 105 345" />
    <path id="hl-AD" data-ref="/ A D /" class="geom-line geom-overlay" d="M 38 45 L 38 220 L 38 395" />
    <path id="hl-BE" data-ref="/ B E /" class="geom-line geom-overlay" d="M 172 45 L 172 220 L 172 395" />
    <path id="hl-CF" data-ref="/ C F /" class="geom-line geom-overlay" d="M 105 95 L 105 220 L 105 345" />
  </g>
  <g id="points">
    <circle id="el-pt-A" data-ref="A" data-type="point" cx="38" cy="45" r="3.2" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="172" cy="45" r="3.2" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="105" cy="95" r="3.2" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="38" cy="395" r="3.2" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="172" cy="395" r="3.2" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="105" cy="345" r="3.2" class="geom-point" />
  </g>
  <g id="labels">
    <text id="lbl-a" data-ref="A" x="38" y="33" text-anchor="middle" class="geom-label">a</text>
    <text id="lbl-b" data-ref="B" x="172" y="33" text-anchor="middle" class="geom-label">b</text>
    <text id="lbl-c" data-ref="C" x="105" y="83" text-anchor="middle" class="geom-label">c</text>
    <text id="lbl-d" data-ref="D" x="38" y="413" text-anchor="middle" class="geom-label">d</text>
    <text id="lbl-e" data-ref="E" x="172" y="413" text-anchor="middle" class="geom-label">e</text>
    <text id="lbl-f" data-ref="F" x="105" y="363" text-anchor="middle" class="geom-label">f</text>
  </g>
</svg>

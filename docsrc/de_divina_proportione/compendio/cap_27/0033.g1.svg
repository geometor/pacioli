    <path id="hl-BA" data-ref="/ B A /" class="geom-bold geom-overlay" d="M 35 290 L 170 290 L 305 290" />
    <path id="hl-CF" data-ref="/ C F /" class="geom-line geom-overlay" d="M 116 290 L 116 200 L 116 110" />
    <path id="hl-BE" data-ref="/ B E /" class="geom-line geom-overlay" d="M 35 290 L 75.5 228.14 L 116 166.27" />
    <path id="hl-EA" data-ref="/ E A /" class="geom-line geom-overlay" d="M 116 166.27 L 210.5 228.14 L 305 290" />
  </g>

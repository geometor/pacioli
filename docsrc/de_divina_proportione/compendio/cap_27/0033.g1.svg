    <circle id="el-pt-tC1" data-ref="C" data-type="point" cx="215" cy="45" r="3.2" class="geom-point" />
    <circle id="el-pt-tC2" data-ref="C" data-type="point" cx="235" cy="45" r="3.2" class="geom-point" />

    <polygon id="el-poly-PQN" data-ref="&lt; P Q N &gt;" data-type="polygon" points="284,205 284,49 228.62,181.92" class="geom-polygon-gnomon" />
    <path id="el-seg-AB" data-ref="/ A B /" data-type="segment" class="geom-bold" d="M 50 205 L 219 205 L 388 205" />
    <path id="el-seg-MQ" data-ref="/ M Q /" data-type="segment" class="geom-line" d="M 219 205 L 251.5 127 L 284 49" />
    <path id="el-seg-PQ" data-ref="/ P Q /" data-type="segment" class="geom-bold" d="M 284 205 L 284 127 L 284 49" />
    <path id="el-seg-PN" data-ref="/ P N /" data-type="segment" class="geom-dashed" d="M 284 205 L 256.31 193.46 L 228.62 181.92" />
    <path id="el-seg-QN" data-ref="/ Q N /" data-type="segment" class="geom-bold" d="M 284 49 L 256.31 115.46 L 228.62 181.92" />
    <path id="el-seg-AQ" data-ref="/ A Q /" data-type="segment" class="geom-dashed" d="M 50 205 L 167 127 L 284 49" />
    <path id="el-seg-BQ" data-ref="/ B Q /" data-type="segment" class="geom-dashed" d="M 388 205 L 336 127 L 284 49" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <path id="hl-arc-semi" data-ref="( M B )" class="geom-circle geom-overlay" d="M 388 205 A 169 169 0 0 0 50 205" />
    <polygon id="hl-poly-MPQ" data-ref="&lt; M P Q &gt;" points="219,205 284,205 284,49" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-PQN" data-ref="&lt; P Q N &gt;" points="284,205 284,49 228.62,181.92" class="geom-polygon-gnomon geom-overlay" />
    <path id="hl-seg-AB" data-ref="/ A B /" class="geom-bold geom-overlay" d="M 50 205 L 219 205 L 388 205" />
    <path id="hl-seg-MQ" data-ref="/ M Q /" class="geom-line geom-overlay" d="M 219 205 L 251.5 127 L 284 49" />
    <path id="hl-seg-PQ" data-ref="/ P Q /" class="geom-bold geom-overlay" d="M 284 205 L 284 127 L 284 49" />
    <path id="hl-seg-PN" data-ref="/ P N /" class="geom-dashed geom-overlay" d="M 284 205 L 256.31 193.46 L 228.62 181.92" />
    <path id="hl-seg-QN" data-ref="/ Q N /" class="geom-bold geom-overlay" d="M 284 49 L 256.31 115.46 L 228.62 181.92" />
    <path id="hl-seg-AQ" data-ref="/ A Q /" class="geom-dashed geom-overlay" d="M 50 205 L 167 127 L 284 49" />
    <path id="hl-seg-BQ" data-ref="/ B Q /" class="geom-dashed geom-overlay" d="M 388 205 L 336 127 L 284 49" />
  </g>
  <g id="points">

    <circle id="el-pt-M" data-ref="M" data-type="point" cx="219" cy="205" r="3.4" class="geom-point" />
    <circle id="el-pt-P" data-ref="P" data-type="point" cx="284" cy="205" r="3.4" class="geom-point" />
    <circle id="el-pt-B" data-ref="B" data-type="point" cx="388" cy="205" r="3.4" class="geom-point" />
    <circle id="el-pt-Q" data-ref="Q" data-type="point" cx="284" cy="49" r="3.4" class="geom-point" />
    <circle id="el-pt-N" data-ref="N" data-type="point" cx="228.62" cy="181.92" r="3.4" class="geom-point" />

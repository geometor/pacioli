    <text id="ann-ac-lbl" x="186.15" y="246.15" text-anchor="middle" class="geom-label-sm">AC²</text>
    <text id="ann-cap-10" x="192.75" y="320.4" text-anchor="middle" class="geom-label-sm">AB = 10  ⇒  AC = ℞.125 m̄ 5,  CB = 15 m̄ ℞.125</text>

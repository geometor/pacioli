    <circle id="el-pt-B" data-ref="B" data-type="point" cx="300" cy="195" r="3.4" class="geom-point" />
    <circle id="el-pt-C" data-ref="C" data-type="point" cx="236.98" cy="195" r="3.4" class="geom-point" />
    <circle id="el-pt-D" data-ref="D" data-type="point" cx="135" cy="30" r="3.4" class="geom-point" />
    <circle id="el-pt-E" data-ref="E" data-type="point" cx="135" cy="112.5" r="3.4" class="geom-point" />
    <circle id="el-pt-F" data-ref="F" data-type="point" cx="135" cy="296.98" r="3.4" class="geom-point" />

    <polygon id="el-poly-sqAC" data-ref="&lt; A C H F &gt;" data-type="polygon" points="135,195 236.98,195 236.98,296.98 135,296.98" class="geom-polygon-gnomon" />
    <path id="el-seg-AB" data-ref="/ A B /" data-type="segment" class="geom-bold" d="M 135 195 L 217.5 195 L 300 195" />
    <path id="el-seg-AC" data-ref="/ A C /" data-type="segment" class="geom-bold" d="M 135 195 L 185.99 195 L 236.98 195" />

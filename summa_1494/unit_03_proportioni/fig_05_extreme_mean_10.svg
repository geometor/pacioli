    <path id="el-seg-EB" data-ref="/ E B /" data-type="segment" class="geom-dashed" d="M 135 112.5 L 217.5 153.75 L 300 195" />
    <path id="el-seg-CH" data-type="segment" class="geom-line" d="M 236.98 195 L 236.98 245.99 L 236.98 296.98" />
    <path id="el-seg-HF" data-type="segment" class="geom-line" d="M 236.98 296.98 L 185.99 296.98 L 135 296.98" />
  </g>
  <g id="highlights" style="pointer-events: none;">
    <polygon id="hl-poly-sqAB" data-ref="&lt; A B K D &gt;" points="135,195 300,195 300,30 135,30" class="geom-polygon geom-overlay" />
    <polygon id="hl-poly-sqAC" data-ref="&lt; A C H F &gt;" points="135,195 236.98,195 236.98,296.98 135,296.98" class="geom-polygon-gnomon geom-overlay" />
    <path id="hl-arc-cEB" data-ref="( E B )" class="geom-dashed geom-overlay" d="M 118.92 296.27 A 184.48 184.48 0 0 0 308.35 175.59" />
    <path id="hl-arc-cAF" data-ref="( A F )" class="geom-arc geom-overlay" d="M 135 296.98 A 101.98 101.98 0 0 0 236.98 195" />
    <path id="hl-seg-AB" data-ref="/ A B /" class="geom-bold geom-overlay" d="M 135 195 L 217.5 195 L 300 195" />
    <path id="hl-seg-AC" data-ref="/ A C /" class="geom-bold geom-overlay" d="M 135 195 L 185.99 195 L 236.98 195" />
    <path id="hl-seg-CB" data-ref="/ C B /" class="geom-line geom-overlay" d="M 236.98 195 L 268.49 195 L 300 195" />
    <path id="hl-seg-DF" data-ref="/ D F /" class="geom-line geom-overlay" d="M 135 30 L 135 163.49 L 135 296.98" />
    <path id="hl-seg-EB" data-ref="/ E B /" class="geom-dashed geom-overlay" d="M 135 112.5 L 217.5 153.75 L 300 195" />
  </g>
  <g id="points">

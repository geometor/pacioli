    <polygon id="el-poly-wing2" data-ref="&lt; G F I D &gt;" data-type="polygon" points="76,174 154,174 154,44 76,44" class="geom-polygon-gnomon" />
    <polygon id="el-poly-supp" data-ref="&lt; F H C I &gt;" data-type="polygon" points="154,174 284,174 284,44 154,44" class="geom-polygon" />

    <text id="ann-ce-lbl" x="115" y="218.2" text-anchor="middle" class="geom-label-sm">1.ce. = 9</text>
    <text id="ann-co1-lbl" x="219" y="218.2" text-anchor="middle" class="geom-label-sm">5.co. = 15</text>

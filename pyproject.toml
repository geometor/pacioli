[project]
name = "geometor-pacioli"
dynamic = ["version"]
authors = [
  { name="geometor", email="github@geometor.com" },
]
description = "A system for tracking and analyzing the works of Fra Luca Pacioli."
readme = "README.rst"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sympy",
    "geometor-model",
    "textual",
    "rich",
    "jinja2",
    "pillow",
    "pypdfium2",
    "opencv-python",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
pacioli = "geometor.pacioli.__main__:run"
pacioli-extract = "geometor.pacioli.extraction:main"
pacioli-graphics = "geometor.pacioli.graphics:main"

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = {attr = "geometor.pacioli.__version__"}

[project.urls]
"Website" = "https://geometor.github.io/pacioli"
"Repository" = "https://github.com/geometor/pacioli"
"Issues" = "https://github.com/geometor/pacioli/issues"

[tool.ruff]
lint.select = ["E", "F", "I", "ANN", "D"]
lint.ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/geometor/pacioli/{__main__,app,extraction,graphics,pacioli,parse_winterberg,parser,run_parse,run_winterberg_parse}.py" = ["E", "F", "I", "ANN", "D"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]